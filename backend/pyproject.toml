[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-voice"
version = "0.1.0"
description = "Local JAIS-ASR F5 service of JAIS Voice (runs in the ASR model's Python 3.11 environment)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["horizon_voice*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
