<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Horizon Voice — parcours de vérification</title>
<style>body{font:18px system-ui;margin:50px;max-width:700px}input,button{font:inherit;padding:10px}section{padding:20px;background:#f1f5f9;margin-top:20px}</style>
<h1>Recherche de musées</h1>
<form id="search">
  <label for="city">Ville</label>
  <input id="city" name="city" required>
  <button type="submit">Rechercher</button>
</form>
<section id="results" hidden></section>
<script>
document.querySelector('#search').addEventListener('submit', event => {
  event.preventDefault();
  const results = document.querySelector('#results');
  results.hidden = false;
  results.replaceChildren();
  const link = document.createElement('a');
  link.textContent = 'Musée de ' + document.querySelector('#city').value;
  link.href = '#details';
  link.addEventListener('click', () => {
    const details = document.createElement('p');
    details.id = 'details';
    details.textContent = 'Horaire fictif pour le test : 10 h à 17 h. Code de vérification : HORIZON-742.';
    results.append(details);
  });
  results.append(link);
});
</script>
</html>
